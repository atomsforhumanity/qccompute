site_name: qccompute
# The Docs workflow builds the next branch's docs with DOCS_SITE_URL set to
# https://qccompute.docs.afh.org/next/; their pages then show a pre-release banner
# (overrides/main.html).
site_url: !ENV [DOCS_SITE_URL, "https://qccompute.docs.afh.org/"]
theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: amber
      toggle:
        icon: material/lightbulb
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: amber
      toggle:
        icon: material/lightbulb-outline
        name: Switch to light mode
  features:
    - content.tabs.link
    - content.code.annotate
    - content.code.copy
    - announce.dismiss
    - navigation.tabs
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.preview
    - navigation.instant.progress
    - navigation.path
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - toc.follow

  icon:
    repo: fontawesome/brands/github-alt

repo_url: https://github.com/atomsforhumanity/qccompute
edit_uri: edit/next/docs/
site_author: Colton Hicks
plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          options:
            members_order: source
            separate_signature: false
            show_bases: false
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            merge_init_into_class: true
            show_signature_annotations: true
            signature_crossrefs: true
            inherited_members: false
            # Pretty sure I want this false.
            show_if_no_docstring: false

            docstring_options:
              ignore_init_summary: true

            filters:
              - "!^_"
              - "!^model"
              - "^__init__"

          selection:
            new_path_syntax: true

  - exclude:
      glob:
        - dev-docs/**

markdown_extensions:
  - toc:
      permalink: true
      title: Page contents
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.extra
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - markdown_include.include

watch:
  - src/qccompute
  - examples

nav:
  - Getting Started:
      - Welcome to QCCompute: index.md
      - Migrating from 0.22: migration.md
      - Threads: threads.md
  - Programs:
      - Overview: programs/overview.md
      - Programs and sessions (API): api/program.md
      - Running (API): api/runner.md
      - The program interface (design): design/program-interface.md
      - Program pages and examples: https://qccodec.docs.afh.org/next/programs/
  - Examples:
      - Overview: examples/overview.md
      - File Input: examples/file_input.md
      - Many calculations at once: examples/many_calculations.md
      - "Dynamic workflows: futures": examples/dynamic_workflows.md
      - Sessions, lineages and seeds: examples/sessions.md
      - A program from functions: examples/function_program.md
  - Changelog: https://github.com/atomsforhumanity/qccompute/blob/next/CHANGELOG.md
