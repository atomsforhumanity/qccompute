[project]
name = "qccompute"
version = "0.13.2"
description = "A package for operating Quantum Chemistry programs using qcdata standardized data structures. Compatible with TeraChem, psi4, QChem, NWChem, ORCA, Molpro, geomeTRIC and many more."
authors = [{ name = "Colton Hicks", email = "github@coltonhicks.com" }]
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "qccodec>=0.11.0",
    "qcdata>=0.18.0",
    "tomli-w>=1.0.0,<2",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
qcengine = ["qcelemental>=0.26.0,<0.27", "qcengine>=0.27.0,<0.28"]
geometric = ["geometric>=1.0.1,<2"]
all = [
    "qcelemental>=0.26.0,<0.27",
    "qcengine>=0.27.0,<0.28",
    "geometric>=1.0.1,<2",
    "tcpb>=0.16.0",
]

[project.urls]
Homepage = "https://github.com/atomsforhumanity/qccompute"
Source = "https://github.com/atomsforhumanity/qccompute"
Repository = "https://github.com/atomsforhumanity/qccompute"
Changelog = "https://github.com/atomsforhumanity/qccompute/blob/master/CHANGELOG.md"
"Bug Tracker" = "https://github.com/atomsforhumanity/qccompute/issues"
Documentation = "https://qccompute.docs.atomsforhumanity.org"


[dependency-groups]
dev = [
    "ruff>=0.12.0",
    "mypy>=1.3.0,<2",
    "pytest>=7.3.2,<8",
    "pytest-cov>=4.1.0,<5",
    "pytest-mock>=3.11.1,<4",
    "geometric>=1.0.1,<2",
    "qcelemental>=0.26.0,<0.27",
    "qcengine>=0.27.0,<0.28",
    "types-toml>=0.10.8.20240310,<0.11",
    "qccompute",
]
docs = [
    "mkdocs>=1.6.0,<2",
    "mkdocs-material>=9.5.31,<10",
    "markdown-include>=0.8.1,<0.9",
    "pymdown-extensions~=10.9",
    "mkdocstrings[python]>=0.25.2,<0.26",
    "mkdocs-exclude>=1.0.2,<2",
]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.uv.sources]
qccompute = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
exclude = [".venv"]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
isort = { known-first-party = ["qccompute", "tests"] }
select = ["I", "F401"]

[tool.coverage.run]
branch = true
omit = ["*/tests/*", "*/migrations/*", "*site-packages*", "*__init__.py"]

[tool.mypy]
plugins = "pydantic.mypy"
ignore_missing_imports = true
exclude = "(^|/)(dist|site|htmlcov)/"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: marks tests as integration (deselect with '-m \"not integration\"')",
]
filterwarnings = ["ignore::DeprecationWarning:qcengine.*"]

[tool.typos]
# Exclude specific files or directories
files.extend-exclude = [".vscode/**"]
