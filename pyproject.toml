[project]
name = "qccompute"
version = "0.21.0"
description = "A package for operating Quantum Chemistry programs using qcdata standardized data structures. Compatible with TeraChem, psi4, QChem, NWChem, ORCA, Molpro, geomeTRIC and many more."
authors = [{ name = "Colton Hicks", email = "github@coltonhicks.com" }]
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "qccodec>=0.21.0",
    "qcdata>=0.23.1",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
geometric = ["qccodec[geometric]>=0.21.0"]
tcpb = ["qccodec[tcpb]>=0.21.0"]
all = ["qccodec[geometric,tcpb]>=0.21.0"]

[project.urls]
Homepage = "https://github.com/atomsforhumanity/qccompute"
Source = "https://github.com/atomsforhumanity/qccompute"
Repository = "https://github.com/atomsforhumanity/qccompute"
Changelog = "https://github.com/atomsforhumanity/qccompute/blob/master/CHANGELOG.md"
"Bug Tracker" = "https://github.com/atomsforhumanity/qccompute/issues"
Documentation = "https://qccompute.docs.atomsforhumanity.org"


[dependency-groups]
dev = [
    "ruff>=0.12",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-mock>=3.11.1,<4",
    "geometric>=1.0.1,<2",
    "types-toml>=0.10.8.20240310,<0.11",
    "qccompute",
    "pre-commit>=4.0",
    "pre-commit-hooks>=5.0",
    "detect-secrets>=1.5",
    "typos>=1.30",
]
docs = [
    "mkdocs>=1.6.0,<2",
    "mkdocs-material>=9.5.31,<10",
    "markdown-include>=0.8.1,<0.9",
    "pymdown-extensions~=10.9",
    "mkdocstrings[python]>=0.25.2,<0.26",
    "mkdocs-exclude>=1.0.2,<2",
]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.uv.sources]
qccompute = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["*.ipynb", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["E501"] # line length is the formatter's job

[tool.ruff.lint.isort]
known-first-party = ["qccompute", "tests"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D"]
"docs/**" = ["D"]
"examples/**" = ["D"]
"build_tools/**" = ["D"]

[tool.coverage.run]
branch = true
source = ["qccompute"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "scripts", "examples"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_defs = true
exclude = "(^|/)(dist|site|htmlcov)/"

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]

[tool.typos]
# Exclude specific files or directories
files.extend-exclude = [".vscode/**"]
